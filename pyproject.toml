[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "calibri"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "pyyaml",
    "scipy",
]

[project.scripts]
calibri-run = "calibri.cli:main"

[project.optional-dependencies]
streamlit = ["streamlit"]
colmap = ["pycolmap"]

[tool.setuptools.packages.find]
include = ["calibri*"]
